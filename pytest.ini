[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# Markers
markers =
    requires_credentials: test requires real Hetzner credentials
    integration: integration test with real API
    e2e: end-to-end test
    vpn: test requires wireguard-tools
