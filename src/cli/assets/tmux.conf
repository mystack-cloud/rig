# rig's tmux configuration for live agents. Used only with `tmux -L rig -f <this file>`,
# so it never touches a tmux the user runs themselves. Deployed by authorize.yml.

# The agent's TUI should look exactly as it does outside tmux.
set -g status off
set -g default-shell /bin/bash
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Recommended by Claude Code's docs (https://code.claude.com/docs/en/terminal-config):
# without these Shift+Enter submits and desktop notifications never reach the terminal.
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# A smaller scrollback keeps Cursor's reattach redraw short.
set -g history-limit 1000
set -sg escape-time 10

# Several terminals can join one live agent; follow the most recently active one.
set -g window-size latest
set -g aggressive-resize on

# Keep the pane when the agent fails so its error stays readable. `rig attach` and
# `rig exec` replace a dead pane the next time.
set -g remain-on-exit failed
