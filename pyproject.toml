[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mystack-rig"
dynamic = ["version"]
authors = [
  { name = "mystack-cloud" },
]
description = "Ephemeral remotes with full local parity for coding agents"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["remote-development", "coding-agents", "hetzner"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "requests>=2.25.0",
  "ansible>=4.0.0",
  "boto3>=1.26.0",
  "PyYAML>=6.0",
  "cryptography>=41.0.0",
  "importlib-metadata>=4.0; python_version < '3.8'",
]

[project.urls]
Homepage = "https://github.com/mystack-cloud/rig"
Source = "https://github.com/mystack-cloud/rig"
Issues = "https://github.com/mystack-cloud/rig/issues"

[project.scripts]
rig = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Mirrors the old .flake8 ignores where enabling the rule would flood the diff.
# Tighten these gradually rather than all at once.
ignore = [
  "E501",  # line length: the formatter wraps code; long strings (playbooks) are left alone
  "E402",  # module-level import not at top
  "F401",  # unused import
  "F841",  # unused variable
  "F541",  # f-string without placeholders
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E741"]

[tool.ruff.format]
quote-style = "double"
